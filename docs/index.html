<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Circle</title>
<meta name="description" content="Find a church, join events, and more you don't want to miss. Four Circle is coming soon to the App Store. Leave your email and we will tell you the day it opens.">
<meta name="theme-color" content="#120d08">
<link rel="canonical" href="https://fourcircle.app/">

<!-- Opening the link from an Instagram bio shows this card, so it is written
     for that and not for a search result. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Four Circle">
<meta property="og:description" content="Find a church, join events, and more you don't want to miss. Coming soon.">
<meta property="og:image" content="https://fourcircle.app/hero.jpg">
<meta property="og:url" content="https://fourcircle.app/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
  :root {
    --gold: #c9a96e;
    --gold-lit: #e8d3a4;
    --ground: #120d08;
    --rule: rgba(201,169,110,0.3);
    --ink: #f6f2ea;
    --ink-2: rgba(246,242,234,0.76);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "DM Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #2a1c10 url("hero.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* Dark at both ends and lighter through the middle, so the words are
     readable and the photograph is still a photograph. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,7,4,0.82) 0%,
      rgba(10,7,4,0.44) 42%,
      rgba(10,7,4,0.90) 100%);
  }

  /* ===== the bar ====================================================== */

  .top {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 20px 22px;
  }
  .name {
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold-lit);
  }

  /* Shaped like the badge Apple issues, because that shape is what everybody
     reads as "this is an iPhone app". It is not that badge: Apple only hands
     the real one out for apps that are in the store, and it does not make a
     "coming soon" version. Swap it for the official one on launch day, which
     is the whole of the change: same corner, same size. */
  .badge {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 10px;
    background: rgba(8,6,4,0.72);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 7px 14px 8px 12px;
    text-align: left; white-space: nowrap;
  }
  .badge svg { flex: none; width: 21px; height: 21px; fill: #fff; }
  .badge .lines { display: flex; flex-direction: column; line-height: 1.15; }
  .badge .small {
    font-size: 0.56rem; font-weight: 500; letter-spacing: 0.04em;
    color: rgba(255,255,255,0.82);
  }
  .badge .store {
    font-size: 1.02rem; font-weight: 600; letter-spacing: -0.005em; color: #fff;
  }

  /* ===== the middle =================================================== */

  main {
    position: relative; flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: 40px 22px 30px;
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(3rem, 16vw, 6.5rem); line-height: 1; margin: 0 0 18px;
    letter-spacing: -0.01em;
    /* Filled with a gradient rather than a flat colour, which is what gives
       the reference its lift. Gold through cream and back, not a rainbow:
       the point is the finish, and the colours are already decided. */
    color: var(--gold-lit);
    background-image: linear-gradient(100deg, #c9a96e 0%, #f7ead0 46%, #d9b97e 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 { color: transparent; }
  }

  /* ===== the box ====================================================== */

  form {
    display: flex; align-items: center; gap: 6px;
    width: 100%; max-width: 27rem;
    background: rgba(255,255,255,0.09);
    border: 1px solid var(--rule); border-radius: 11px;
    padding: 5px 5px 5px 12px;
  }
  form:focus-within { border-color: var(--gold-lit); }

  input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 0.97rem; color: var(--ink);
    background: none; border: 0; padding: 12px 10px;
  }
  input::placeholder { color: rgba(246,242,234,0.5); }
  input:focus { outline: none; }

  button {
    flex: none;
    font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    color: #1a1208; background: #fdfbf6;
    border: 0; border-radius: 8px; padding: 12px 20px;
    transition: background .15s, transform .08s;
  }
  button:hover { background: var(--gold-lit); }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: 0.6; cursor: default; transform: none; }

  /* The one line that says what the app is. Under the headline, above the
     box, in the quieter weight so it reads as the answer to "coming soon
     what?" rather than as a second headline. */
  .what {
    font-size: clamp(0.95rem, 4.2vw, 1.1rem); color: var(--ink-2);
    margin: 0 0 32px; max-width: 23rem;
  }

  .msg { min-height: 1.3rem; margin: 14px 0 0; font-size: 0.88rem; color: var(--ink-2); }
  .msg.bad { color: #ffb4a2; }

  /* Replaces the form once it has been sent, rather than sitting under it, so
     the page cannot be left looking as though nothing happened.

     outline: none is the whole point of this rule. The element is given a
     tabindex and focused so a screen reader reads the confirmation out, and
     the browser repays that by drawing its own focus rectangle around it: a
     hard-edged box nobody designed, with the text pressed against the bottom
     of it. The announcement is still made; only the browser's box goes. */
  /* The success state is its own screen. "Coming Soon" and the line under it
     exist to get somebody as far as the box; once they are through it, both
     are just things standing in front of the only sentence that still
     matters, so they go. */
  main.sent h1, main.sent .what { display: none; }

  .done {
    outline: none;
    padding: 4px 0 2px;
    animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
  }
  .done .tick {
    width: 54px; height: 54px; margin: 0 auto 20px; border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.5);
    background: rgba(201,169,110,0.12);
    display: grid; place-items: center;
  }
  .done .tick span {
    display: block; width: 17px; height: 9px; margin-top: -5px;
    border-left: 2px solid var(--gold-lit); border-bottom: 2px solid var(--gold-lit);
    transform: rotate(-45deg);
  }
  .done h2 {
    font-family: var(--display); font-weight: 600; color: #fff;
    font-size: clamp(1.4rem, 6vw, 1.7rem); line-height: 1.25; margin: 0 0 12px;
  }
  .done p { color: var(--ink-2); margin: 0; font-size: 1rem; line-height: 1.5; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .done { animation: none; }
  }

  /* ===== the bottom =================================================== */

  footer {
    position: relative;
    display: flex; justify-content: space-between; gap: 14px;
    padding: 20px 22px 26px;
    font-size: 0.78rem; color: rgba(246,242,234,0.5);
  }
  footer a { color: rgba(201,169,110,0.92); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer div { display: flex; gap: 16px; }

  @media (max-width: 26rem) {
    .top { flex-direction: column; gap: 14px; }
    footer { flex-direction: column; align-items: center; text-align: center; }
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>

<header class="top">
  <div class="name">Four Circle</div>
  <div class="badge">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
    <span class="lines"><span class="small">Coming Soon on</span><span class="store">App Store</span></span>
  </div>
</header>

<main>
  <h1>Coming Soon</h1>
  <p class="what">Find a church, join&nbsp;events,&nbsp;and&nbsp;more you don't want to miss.</p>

  <div id="box">
    <form id="form" novalidate>
      <label class="visually-hidden" for="email">Your email address</label>
      <input type="email" id="email" name="email" placeholder="Notify me of release"
             autocomplete="email" inputmode="email" required>
      <button type="submit" id="go">Notify Me</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</main>

<footer>
  <a href="privacy.html">Privacy Policy</a>
  <div><a href="support.html">Support</a></div>
</footer>

<script>
(function () {
  'use strict';

  // The publishable key, which is meant to be public: it identifies the
  // project and nothing more. What it is allowed to do is decided in the
  // database, and there it is allowed to call one function, join_waitlist,
  // which takes an address and returns nothing about anybody else. It cannot
  // read this list or any other table. See supabase/27_waitlist.sql.
  var API = 'https://mmhpfiabbpzaizkjozjq.supabase.co/rest/v1/rpc/join_waitlist';
  var WELCOME = 'https://mmhpfiabbpzaizkjozjq.supabase.co/functions/v1/waitlist-welcome';
  var KEY = 'sb_publishable_sVF7I5TRILs0rhDGRgTl3Q_eerLcV_6';

  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var box = document.getElementById('box');

  function say(text, bad) {
    msg.textContent = text;
    msg.className = bad ? 'msg bad' : 'msg';
  }

  // Where the visit came from, so the list says which link worked. Only the
  // site, never the full address: the rest of a referrer can carry a search
  // somebody typed, and that is not ours to keep.
  function source() {
    var q = new URLSearchParams(location.search).get('from');
    if (q) return q.slice(0, 40);
    try {
      if (document.referrer) return new URL(document.referrer).hostname;
    } catch (e) { /* a referrer that will not parse tells us nothing */ }
    return 'site';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var address = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(address)) {
      say('Please check that email address.', true);
      email.focus();
      return;
    }

    go.disabled = true;
    go.textContent = 'Sending';
    say('');

    fetch(API, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_email: address, p_source: source() })
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);

      // role and tabindex before the content, not after: a live region has to
      // exist before what it is announcing goes into it, and a div is not
      // focusable until it is told it can be.
      box.setAttribute('role', 'status');
      box.setAttribute('tabindex', '-1');
      box.className = 'done';
      box.innerHTML =
        '<div class="tick" aria-hidden="true"><span></span></div>' +
        '<h2>You\'re on the list.</h2>' +
        '<p>We\'ll email you the day the Four Circle app opens.</p>';
      document.querySelector('main').classList.add('sent');
      box.focus();

      // Asked for, never waited on, and allowed to fail.
      //
      // The address is already saved by the time this runs, and saving it is
      // the part that cannot be done again later. So the welcome email is a
      // separate request whose failure is swallowed: if the function is not
      // deployed, or Resend is down, or the key is wrong, the person is still
      // on the list and the page still says so. keepalive, because they may
      // well close the tab a second after reading the confirmation and the
      // browser would otherwise cancel this on the way out.
      try {
        fetch(WELCOME, {
          method: 'POST',
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: address }),
          keepalive: true
        }).catch(function () { /* the list is what mattered */ });
      } catch (e) { /* ditto */ }
    }).catch(function () {
      go.disabled = false;
      go.textContent = 'Notify Me';
      say('That did not send. Please try again in a moment.', true);
    });
  });
})();
</script>

</body>
</html>
