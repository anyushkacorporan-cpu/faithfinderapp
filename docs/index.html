<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaithFinder</title>
<meta name="description" content="FaithFinder is coming in 2026. Leave your email and we will tell you the day it opens.">
<meta name="theme-color" content="#120d08">

<!-- Opening the link from an Instagram bio shows this card, so it is written
     for that and not for a search result. -->
<meta property="og:type" content="website">
<meta property="og:title" content="FaithFinder">
<meta property="og:description" content="Coming soon, 2026. Be the first to know.">
<meta property="og:image" content="hero.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
  :root {
    --gold: #c9a96e;
    --gold-lit: #e3c88f;
    --ground: #120d08;
    --rule: rgba(201,169,110,0.26);
    --ink: #f6f2ea;
    --ink-2: rgba(246,242,234,0.74);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "DM Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: #2a1c10 url("hero.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* Dark at both ends and lighter through the middle, so the words are
     readable and the photograph is still a photograph. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,7,4,0.80) 0%,
      rgba(10,7,4,0.42) 38%,
      rgba(10,7,4,0.88) 100%);
  }

  main {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 46px 22px 30px;
  }

  /* The cross, drawn rather than typed, for the same reason it is drawn in the
     app: a cross as a character is a glyph the font chooses, and some phones
     hand back a colour emoji instead of a mark. */
  .cross { position: relative; width: 20px; height: 30px; margin: 0 auto 18px; }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--gold); }
  .cross::before { left: 9px; top: 0; width: 2px; height: 30px; }
  .cross::after { left: 0; top: 8px; width: 20px; height: 2px; }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.6rem, 13vw, 4rem); line-height: 1.05;
    letter-spacing: 0.005em; margin: 0 0 16px;
  }

  .soon {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--gold-lit);
    margin: 0 0 46px;
  }

  h2 {
    font-family: var(--display); font-weight: 600;
    font-size: clamp(1.35rem, 6.5vw, 1.7rem); line-height: 1.25;
    margin: 0 0 16px;
  }

  form { width: 100%; max-width: 25rem; display: grid; gap: 9px; }
  @media (min-width: 30rem) { form { grid-template-columns: 1fr auto; } }

  input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink); text-align: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 16px;
  }
  @media (min-width: 30rem) { input { text-align: left; } }
  input::placeholder { color: rgba(246,242,234,0.45); }
  input:focus { outline: 2px solid var(--gold-lit); outline-offset: 1px; border-color: transparent; }

  button {
    font: inherit; font-weight: 700; font-size: 0.98rem; cursor: pointer;
    color: #1a1208; background: var(--gold);
    border: 0; border-radius: 12px; padding: 14px 24px;
    transition: background .15s, transform .08s;
  }
  button:hover { background: var(--gold-lit); }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: 0.6; cursor: default; transform: none; }

  .msg { min-height: 1.3rem; margin: 13px 0 0; font-size: 0.9rem; color: var(--ink-2); }
  .msg.bad { color: #ffb4a2; }

  /* Replaces the form once it has been sent, rather than sitting under it, so
     the page cannot be left looking as though nothing happened. */
  .done .tick {
    width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%;
    border: 1.5px solid var(--gold); display: grid; place-items: center;
  }
  .done .tick span {
    display: block; width: 16px; height: 8px; margin-top: -4px;
    border-left: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
    transform: rotate(-45deg);
  }
  .done p { color: var(--ink-2); margin: 0; }

  footer {
    position: relative;
    padding: 0 22px 34px;
    text-align: center;
    font-size: 0.78rem;
    color: rgba(246,242,234,0.5);
  }
  footer a { color: rgba(201,169,110,0.9); margin: 0 10px; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>

<main>
  <div class="cross" aria-hidden="true"></div>
  <h1>FaithFinder</h1>
  <p class="soon">Coming soon 2026</p>

  <div id="box">
    <h2>Be the first to know.</h2>
    <form id="form" novalidate>
      <label class="visually-hidden" for="email">Your email address</label>
      <input type="email" id="email" name="email" placeholder="you@email.com"
             autocomplete="email" inputmode="email" required>
      <button type="submit" id="go">Notify me</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</main>

<footer>
  <a href="privacy.html">Privacy</a><a href="support.html">Support</a>
</footer>

<script>
(function () {
  'use strict';

  // The publishable key, which is meant to be public: it identifies the
  // project and nothing more. What it is allowed to do is decided in the
  // database, and there it is allowed to call one function, join_waitlist,
  // which takes an address and returns nothing about anybody else. It cannot
  // read this list or any other table. See supabase/27_waitlist.sql.
  var API = 'https://mmhpfiabbpzaizkjozjq.supabase.co/rest/v1/rpc/join_waitlist';
  var KEY = 'sb_publishable_sVF7I5TRILs0rhDGRgTl3Q_eerLcV_6';

  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var box = document.getElementById('box');

  function say(text, bad) {
    msg.textContent = text;
    msg.className = bad ? 'msg bad' : 'msg';
  }

  // Where the visit came from, so the list says which link worked. Only the
  // site, never the full address: the rest of a referrer can carry a search
  // somebody typed, and that is not ours to keep.
  function source() {
    var q = new URLSearchParams(location.search).get('from');
    if (q) return q.slice(0, 40);
    try {
      if (document.referrer) return new URL(document.referrer).hostname;
    } catch (e) { /* a referrer that will not parse tells us nothing */ }
    return 'site';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var address = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(address)) {
      say('Please check that email address.', true);
      email.focus();
      return;
    }

    go.disabled = true;
    go.textContent = 'Sending';
    say('');

    fetch(API, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_email: address, p_source: source() })
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);

      // role and tabindex before the content, not after: a live region has to
      // exist before what it is announcing goes into it, and a div is not
      // focusable until it is told it can be.
      box.setAttribute('role', 'status');
      box.setAttribute('tabindex', '-1');
      box.className = 'done';
      box.innerHTML =
        '<div class="tick" aria-hidden="true"><span></span></div>' +
        '<h2>You are on the list.</h2>' +
        '<p>We will email you the day FaithFinder opens.</p>';
      box.focus();
    }).catch(function () {
      go.disabled = false;
      go.textContent = 'Notify me';
      say('That did not send. Please try again in a moment.', true);
    });
  });
})();
</script>

</body>
</html>
