<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Circle</title>
<meta name="description" content="Four Circle is coming soon to the App Store. Leave your email and we will tell you the day it opens.">
<meta name="theme-color" content="#120d08">

<!-- Opening the link from an Instagram bio shows this card, so it is written
     for that and not for a search result. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Four Circle">
<meta property="og:description" content="Coming soon. Be the first to know.">
<meta property="og:image" content="hero.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
  :root {
    --gold: #c9a96e;
    --gold-lit: #e8d3a4;
    --ground: #120d08;
    --rule: rgba(201,169,110,0.3);
    --ink: #f6f2ea;
    --ink-2: rgba(246,242,234,0.76);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "DM Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #2a1c10 url("hero.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* Dark at both ends and lighter through the middle, so the words are
     readable and the photograph is still a photograph. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,7,4,0.82) 0%,
      rgba(10,7,4,0.44) 42%,
      rgba(10,7,4,0.90) 100%);
  }

  /* ===== the bar ====================================================== */

  .top {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 20px 22px;
  }
  .name {
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold-lit);
  }

  /* Apple's own badge is for apps that are actually in the store, and its logo
     is theirs to place, so this says the same thing in words instead. When
     Four Circle is live, Apple hands over the real badge to put here. */
  .badge {
    border: 1px solid var(--rule); border-radius: 11px;
    background: rgba(10,7,4,0.5);
    padding: 7px 14px; text-align: left;
    font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2); line-height: 1.5; white-space: nowrap;
  }
  .badge b {
    display: block; font-family: var(--display); font-weight: 700;
    font-size: 0.92rem; letter-spacing: 0.01em; text-transform: none;
    color: var(--ink);
  }

  /* ===== the middle =================================================== */

  main {
    position: relative; flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: 40px 22px 30px;
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(3rem, 16vw, 6.5rem); line-height: 1; margin: 0 0 20px;
    letter-spacing: -0.01em;
    /* Filled with a gradient rather than a flat colour, which is what gives
       the reference its lift. Gold through cream and back, not a rainbow:
       the point is the finish, and the colours are already decided. */
    color: var(--gold-lit);
    background-image: linear-gradient(100deg, #c9a96e 0%, #f7ead0 46%, #d9b97e 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 { color: transparent; }
  }

  .tag { font-size: 1.02rem; color: var(--ink-2); margin: 0 0 30px; max-width: 26rem; }
  .tag b { display: block; color: var(--ink); font-weight: 600; font-size: 1.1rem; }

  /* ===== the box ====================================================== */

  form {
    display: flex; align-items: center; gap: 6px;
    width: 100%; max-width: 27rem;
    background: rgba(255,255,255,0.09);
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 5px 5px 5px 8px;
  }
  form:focus-within { border-color: var(--gold-lit); }

  input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 0.97rem; color: var(--ink);
    background: none; border: 0; padding: 12px 10px;
  }
  input::placeholder { color: rgba(246,242,234,0.5); }
  input:focus { outline: none; }

  button {
    flex: none;
    font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    color: #1a1208; background: #fdfbf6;
    border: 0; border-radius: 999px; padding: 12px 20px;
    transition: background .15s, transform .08s;
  }
  button:hover { background: var(--gold-lit); }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: 0.6; cursor: default; transform: none; }

  .msg { min-height: 1.3rem; margin: 14px 0 0; font-size: 0.88rem; color: var(--ink-2); }
  .msg.bad { color: #ffb4a2; }

  /* Replaces the form once it has been sent, rather than sitting under it, so
     the page cannot be left looking as though nothing happened. */
  .done .tick {
    width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
    border: 1.5px solid var(--gold); display: grid; place-items: center;
  }
  .done .tick span {
    display: block; width: 15px; height: 8px; margin-top: -4px;
    border-left: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
    transform: rotate(-45deg);
  }
  .done h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0 0 6px; }
  .done p { color: var(--ink-2); margin: 0; }

  /* ===== the bottom =================================================== */

  footer {
    position: relative;
    display: flex; justify-content: space-between; gap: 14px;
    padding: 20px 22px 26px;
    font-size: 0.78rem; color: rgba(246,242,234,0.5);
  }
  footer a { color: rgba(201,169,110,0.92); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer div { display: flex; gap: 16px; }

  @media (max-width: 26rem) {
    .top { flex-direction: column; gap: 14px; }
    footer { flex-direction: column; align-items: center; text-align: center; }
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>

<header class="top">
  <div class="name">Four Circle</div>
  <div class="badge">Coming soon on<b>App Store</b></div>
</header>

<main>
  <h1>Coming Soon</h1>

  <div id="box">
    <p class="tag"><b>Be the first to know.</b>We will email you the day Four Circle opens, so you can create your account before anybody else.</p>

    <form id="form" novalidate>
      <label class="visually-hidden" for="email">Your email address</label>
      <input type="email" id="email" name="email" placeholder="Please enter your email address"
             autocomplete="email" inputmode="email" required>
      <button type="submit" id="go">Notify Me</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</main>

<footer>
  <a href="privacy.html">Privacy Policy</a>
  <div><a href="support.html">Support</a></div>
</footer>

<script>
(function () {
  'use strict';

  // The publishable key, which is meant to be public: it identifies the
  // project and nothing more. What it is allowed to do is decided in the
  // database, and there it is allowed to call one function, join_waitlist,
  // which takes an address and returns nothing about anybody else. It cannot
  // read this list or any other table. See supabase/27_waitlist.sql.
  var API = 'https://mmhpfiabbpzaizkjozjq.supabase.co/rest/v1/rpc/join_waitlist';
  var KEY = 'sb_publishable_sVF7I5TRILs0rhDGRgTl3Q_eerLcV_6';

  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var box = document.getElementById('box');

  function say(text, bad) {
    msg.textContent = text;
    msg.className = bad ? 'msg bad' : 'msg';
  }

  // Where the visit came from, so the list says which link worked. Only the
  // site, never the full address: the rest of a referrer can carry a search
  // somebody typed, and that is not ours to keep.
  function source() {
    var q = new URLSearchParams(location.search).get('from');
    if (q) return q.slice(0, 40);
    try {
      if (document.referrer) return new URL(document.referrer).hostname;
    } catch (e) { /* a referrer that will not parse tells us nothing */ }
    return 'site';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var address = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(address)) {
      say('Please check that email address.', true);
      email.focus();
      return;
    }

    go.disabled = true;
    go.textContent = 'Sending';
    say('');

    fetch(API, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_email: address, p_source: source() })
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);

      // role and tabindex before the content, not after: a live region has to
      // exist before what it is announcing goes into it, and a div is not
      // focusable until it is told it can be.
      box.setAttribute('role', 'status');
      box.setAttribute('tabindex', '-1');
      box.className = 'done';
      box.innerHTML =
        '<div class="tick" aria-hidden="true"><span></span></div>' +
        '<h2>You are on the list.</h2>' +
        '<p>We will email you the day Four Circle opens.</p>';
      box.focus();
    }).catch(function () {
      go.disabled = false;
      go.textContent = 'Notify Me';
      say('That did not send. Please try again in a moment.', true);
    });
  });
})();
</script>

</body>
</html>
